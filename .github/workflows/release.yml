name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build and attach release zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read version from manifest and verify it matches the release tag
        run: |
          manifest_version=$(jq -r '.version' custom_components/meross_cloud/manifest.json)
          tag_version="${GITHUB_REF_NAME}"
          if [ "$manifest_version" != "$tag_version" ]; then
            echo "::error::manifest.json version ($manifest_version) does not match the release tag ($tag_version)"
            exit 1
          fi

      - name: Zip the integration directory
        working-directory: custom_components/meross_cloud
        run: zip -r ${{ github.workspace }}/meross_cloud.zip ./

      - name: Upload zip to the release
        uses: softprops/action-gh-release@v3
        with:
          files: meross_cloud.zip
